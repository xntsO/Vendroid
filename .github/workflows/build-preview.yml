name: Verify beta branch

on:
  push:
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Validate Vendroid beta
    # The reusable workflow declares a skipped tag-signing job with this permission.
    # Its active validation jobs retain contents: read; no secrets are inherited.
    permissions:
      contents: write
    uses: ./.github/workflows/build-test-debug.yml
